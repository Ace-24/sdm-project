# Render (https://render.com) deployment for the CD part of CI/CD.
# Render builds the app; GitHub Actions triggers the deploy only after the tests pass.
services:
  - type: web
    name: interior-design-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Fresh test data on every deploy so the live demo always has data
    startCommand: python scripts/generate_test_data.py && gunicorn run:app
    autoDeploy: false
    envVars:
      - key: SDM_SECRET_KEY
        generateValue: true
